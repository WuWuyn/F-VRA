[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshare"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
client = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6",
]
server = [
    "openai>=1.40",
    "requests>=2.31",
    "tenacity>=8.2",
    "tqdm>=4.66",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "packaging>=24",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6",
    "openai>=1.40",
    "requests>=2.31",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "packaging>=24",
]

[project.scripts]
pyshare = "pyshare_client.cli:app"
pyshare-client = "pyshare_client.cli:app"
pyshare-server = "pyshare_server.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
